name: Build APK

on:
  workflow_dispatch:
  push:
    paths: [twa-manifest.json, .github/workflows/apk.yml]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - uses: android-actions/setup-android@v3

      - run: npm install -g @bubblewrap/cli

      - name: Point bubblewrap at the SDK/JDK the runner already has
        run: |
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json <<EOF
          { "jdkPath": "$JAVA_HOME", "androidSdkPath": "$ANDROID_HOME" }
          EOF

      # Same keystore every run: the signing cert's fingerprint has to stay
      # stable, it's what assetlinks.json on the site vouches for.
      - name: Restore the permanent keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android.keystore

      # Passwords via env vars skip those prompts entirely (see bubblewrap
      # cmds/build.js getPasswords()). The only prompt left is "no checksum
      # found, regenerate?" on first build, answered with "y" on stdin.
      - name: Build
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: printf 'y\n' | bubblewrap build --skipPwaValidation

      - uses: actions/upload-artifact@v4
        with:
          name: calculadora-combos-apk
          path: app-release-signed.apk
