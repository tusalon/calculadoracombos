name: Build APK

on:
  workflow_dispatch:
  push:
    paths: [twa-manifest.json, .github/workflows/apk.yml]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - uses: android-actions/setup-android@v3

      - run: npm install -g @bubblewrap/cli

      - name: Point bubblewrap at the SDK/JDK the runner already has
        run: |
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json <<EOF
          { "jdkPath": "$JAVA_HOME", "androidSdkPath": "$ANDROID_HOME" }
          EOF

      - name: Keystore (auto-generated, debug-only signing)
        run: |
          keytool -genkeypair -v -keystore android.keystore -alias combos \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass combos123 -keypass combos123 \
            -dname "CN=Combos, OU=Rservasroma, O=Rservasroma, L=Havana, S=Havana, C=CU"

      # Passwords via env vars skip those prompts entirely (see bubblewrap
      # cmds/build.js getPasswords()). The only prompt left is "no checksum
      # found, regenerate?" on first build, answered with "y" on stdin.
      - name: Build
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: combos123
          BUBBLEWRAP_KEY_PASSWORD: combos123
        run: printf 'y\n' | bubblewrap build --skipPwaValidation

      - uses: actions/upload-artifact@v4
        with:
          name: calculadora-combos-apk
          path: app-release-signed.apk
